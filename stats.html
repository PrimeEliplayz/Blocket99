<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocket Stats</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #09080d;
            --panel: #211936;
            --panel-soft: #30234b;
            --accent: #b889ff;
            --text: #f7f3ff;
            --muted: #c0b7d1;
            --line: #51436c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px max(24px, calc((100vw - 1000px) / 2));
            border-bottom: 1px solid var(--line);
        }

        .brand {
            color: var(--accent);
            font-size: 21px;
            font-weight: 700;
            text-decoration: none;
        }

        .header-actions { display: flex; align-items: center; gap: 16px; }

        a, button { font: inherit; }

        .home-link { color: var(--muted); text-decoration: none; }
        .home-link:hover { color: var(--text); }

        button {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel-soft);
            color: var(--text);
            cursor: pointer;
        }

        button:hover { border-color: var(--accent); }
        button:disabled { cursor: wait; opacity: 0.65; }

        main {
            width: min(1000px, calc(100% - 40px));
            margin: 54px auto;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); }
        .intro { margin: 10px 0 28px; color: var(--muted); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .stat {
            min-width: 0;
            padding: 22px;
            background: var(--panel);
        }

        .stat + .stat { border-left: 1px solid var(--line); }
        .stat-label { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
        .stat-value { margin: 0; overflow-wrap: anywhere; font-size: 20px; font-weight: 700; }
        #account-id { font-size: 14px; }

        .message {
            margin-top: 18px;
            color: var(--muted);
        }

        .message[data-state="error"] { color: #ffaaa9; }

        @media (max-width: 640px) {
            header { padding: 16px 20px; }
            .header-actions { gap: 10px; }
            main { margin-top: 36px; }
            .stats-grid { grid-template-columns: 1fr; }
            .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html">Blocket</a>
        <nav class="header-actions" aria-label="Main navigation">
            <a class="home-link" href="index.html">Home</a>
            <button id="sign-out" type="button">Sign out</button>
        </nav>
    </header>

    <main>
        <p class="eyebrow">Your account</p>
        <h1>Stats</h1>
        <p class="intro">Your Blocket account overview.</p>

        <section class="stats-grid" aria-label="Account statistics">
            <article class="stat">
                <p class="stat-label">Signed in as</p>
                <p class="stat-value" id="account-email">Loading...</p>
            </article>
            <article class="stat">
                <p class="stat-label">Email status</p>
                <p class="stat-value" id="email-status">Loading...</p>
            </article>
            <article class="stat">
                <p class="stat-label">Member since</p>
                <p class="stat-value" id="member-since">Loading...</p>
            </article>
        </section>
        <p class="message" id="stats-message" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
        import { getCurrentUser, signOut } from './auth.js';

        const message = document.getElementById('stats-message');
        const { user, error } = await getCurrentUser();

        if (error || !user) {
            window.location.replace('login.html');
        } else {
            document.getElementById('account-email').textContent = user.email || 'No email available';
            document.getElementById('email-status').textContent = user.email_confirmed_at ? 'Verified' : 'Not verified';
            document.getElementById('member-since').textContent = user.created_at
                ? new Date(user.created_at).toLocaleDateString()
                : 'Unknown';
        }

        document.getElementById('sign-out').addEventListener('click', async (event) => {
            const button = event.currentTarget;
            button.disabled = true;
            message.textContent = '';
            const { error: signOutError } = await signOut();

            if (signOutError) {
                message.textContent = signOutError.message || 'Could not sign out.';
                message.dataset.state = 'error';
                button.disabled = false;
                return;
            }

            window.location.replace('index.html');
        });
    </script>
</body>
</html>
