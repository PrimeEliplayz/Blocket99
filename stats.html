<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocket Stats</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #09080d;
            --panel: #211936;
            --panel-soft: #30234b;
            --accent: #b889ff;
            --text: #f7f3ff;
            --muted: #c0b7d1;
            --line: #51436c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px max(24px, calc((100vw - 1000px) / 2));
            border-bottom: 1px solid var(--line);
        }

        .brand {
            color: var(--accent);
            font-size: 21px;
            font-weight: 700;
            text-decoration: none;
        }

        .header-actions { display: flex; align-items: center; gap: 16px; }

        a, button { font: inherit; }

        .home-link { color: var(--muted); text-decoration: none; }
        .home-link:hover { color: var(--text); }

        button {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel-soft);
            color: var(--text);
            cursor: pointer;
        }

        button:hover { border-color: var(--accent); }
        button:disabled { cursor: wait; opacity: 0.65; }

        main {
            width: min(1000px, calc(100% - 40px));
            margin: 54px auto;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); }
        .intro { margin: 10px 0 28px; color: var(--muted); }

        .profile-heading {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .profile-avatar {
            width: 104px;
            height: 104px;
            flex: 0 0 104px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            object-fit: cover;
            background: var(--panel);
        }

        .profile-username { margin: 8px 0 0; color: var(--muted); }

        .section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin: 38px 0 14px;
        }

        h2 { margin: 0; font-size: 22px; }
        .section-count { color: var(--muted); font-size: 14px; }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            min-height: 80px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel);
        }

        .badge-item.is-locked { opacity: 0.48; }

        .badge-image {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            object-fit: contain;
        }

        .badge-name { margin: 0 0 4px; font-weight: 700; }
        .badge-description { margin: 0; color: var(--muted); font-size: 12px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .stat {
            min-width: 0;
            padding: 22px;
            background: var(--panel);
        }

        .stat + .stat { border-left: 1px solid var(--line); }
        .stat-label { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
        .stat-value { margin: 0; overflow-wrap: anywhere; font-size: 20px; font-weight: 700; }
        #account-id { font-size: 14px; }

        .message {
            margin-top: 18px;
            color: var(--muted);
        }

        .message[data-state="error"] { color: #ffaaa9; }

        @media (max-width: 640px) {
            header { padding: 16px 20px; }
            .header-actions { gap: 10px; }
            main { margin-top: 36px; }
            .stats-grid { grid-template-columns: 1fr; }
            .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
            .profile-avatar { width: 84px; height: 84px; flex-basis: 84px; }
            .badge-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 380px) {
            .badge-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html">Blocket</a>
        <nav class="header-actions" aria-label="Main navigation">
            <a class="home-link" href="index.html">Home</a>
            <button id="sign-out" type="button">Sign out</button>
        </nav>
    </header>

    <main>
        <p class="eyebrow">Your account</p>
        <h1>Stats</h1>
        <p class="intro">Your Blocket account overview.</p>

        <section class="profile-heading" aria-label="Player profile">
            <img class="profile-avatar" id="profile-avatar" src="assets/badges/Gold%20Doubloon.webp" alt="Gold Doubloon profile picture">
            <div>
                <p class="eyebrow">Player profile</p>
                <p class="profile-username" id="profile-username">Loading...</p>
            </div>
        </section>

        <section class="stats-grid" aria-label="Account statistics">
            <article class="stat">
                <p class="stat-label">Games played</p>
                <p class="stat-value" id="games-played">Loading...</p>
            </article>
            <article class="stat">
                <p class="stat-label">Wins</p>
                <p class="stat-value" id="wins">Loading...</p>
            </article>
            <article class="stat">
                <p class="stat-label">Losses</p>
                <p class="stat-value" id="losses">Loading...</p>
            </article>
            <article class="stat">
                <p class="stat-label">Total score</p>
                <p class="stat-value" id="total-score">Loading...</p>
            </article>
        </section>
        <section aria-labelledby="badges-title">
            <div class="section-heading">
                <h2 id="badges-title">Badge collection</h2>
                <span class="section-count" id="badge-count"></span>
            </div>
            <div class="badge-grid" id="badge-grid"></div>
        </section>
        <p class="message" id="stats-message" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
        import { getCurrentUser, getStatsPageData, signOut } from './auth.js';

        const message = document.getElementById('stats-message');
        const { user, error } = await getCurrentUser();

        if (error || !user) {
            window.location.replace('login.html');
        } else {
            const account = await getStatsPageData(user.id);

            if (account.error) {
                message.textContent = account.error.message || 'Could not load your profile and badges.';
                message.dataset.state = 'error';
            } else {
                document.getElementById('profile-username').textContent = account.profile.username;
                document.getElementById('profile-avatar').src = account.profile.avatar_path;
                document.getElementById('games-played').textContent = account.stats.games_played.toLocaleString();
                document.getElementById('wins').textContent = account.stats.wins.toLocaleString();
                document.getElementById('losses').textContent = account.stats.losses.toLocaleString();
                document.getElementById('total-score').textContent = account.stats.total_score.toLocaleString();

                const earnedCount = account.earnedBadgeIds.size;
                document.getElementById('badge-count').textContent = `${earnedCount} / ${account.badges.length} earned`;

                for (const badge of account.badges) {
                    const isEarned = account.earnedBadgeIds.has(badge.id);
                    const item = document.createElement('article');
                    item.className = `badge-item${isEarned ? '' : ' is-locked'}`;

                    const image = document.createElement('img');
                    image.className = 'badge-image';
                    image.src = badge.image_path;
                    image.alt = '';
                    image.loading = 'lazy';

                    const details = document.createElement('div');
                    const name = document.createElement('p');
                    name.className = 'badge-name';
                    name.textContent = badge.name;
                    const description = document.createElement('p');
                    description.className = 'badge-description';
                    description.textContent = isEarned ? badge.description : 'Locked';

                    details.append(name, description);
                    item.append(image, details);
                    document.getElementById('badge-grid').append(item);
                }
            }
        }

        document.getElementById('sign-out').addEventListener('click', async (event) => {
            const button = event.currentTarget;
            button.disabled = true;
            message.textContent = '';
            const { error: signOutError } = await signOut();

            if (signOutError) {
                message.textContent = signOutError.message || 'Could not sign out.';
                message.dataset.state = 'error';
                button.disabled = false;
                return;
            }

            window.location.replace('index.html');
        });
    </script>
</body>
</html>
