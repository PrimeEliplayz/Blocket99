<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocket Stats</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #09080d;
            --panel: #211936;
            --panel-soft: #30234b;
            --accent: #b889ff;
            --text: #f7f3ff;
            --muted: #c0b7d1;
            --line: #51436c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px max(24px, calc((100vw - 1000px) / 2));
            border-bottom: 1px solid var(--line);
        }

        .brand {
            color: var(--accent);
            font-size: 21px;
            font-weight: 700;
            text-decoration: none;
        }

        .header-actions { display: flex; align-items: center; gap: 16px; }

        a, button { font: inherit; }

        .home-link { color: var(--muted); text-decoration: none; }
        .home-link:hover { color: var(--text); }

        button {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel-soft);
            color: var(--text);
            cursor: pointer;
        }

        button:hover { border-color: var(--accent); }
        button:disabled { cursor: wait; opacity: 0.65; }

        main {
            width: min(1000px, calc(100% - 40px));
            margin: 54px auto;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); }
        .intro { margin: 10px 0 28px; color: var(--muted); }

        .profile-heading {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .profile-avatar {
            width: 104px;
            height: 104px;
            flex: 0 0 104px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            object-fit: cover;
            background: var(--panel);
        }

        .profile-info { min-width: 0; }
        .profile-username { margin: 8px 0 10px; color: var(--muted); }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(7, 58px);
            gap: 8px;
        }

        .badge-button {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            padding: 0;
            overflow: hidden;
            border: 2px solid var(--line);
            border-radius: 50%;
            background: var(--panel-soft);
            cursor: pointer;
        }

        .badge-button:hover,
        .badge-button:focus-visible { border-color: var(--accent); }

        .badge-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(3.2);
            pointer-events: none;
        }

        .badge-button.is-locked { opacity: 0.35; filter: grayscale(1); }

        .badge-dialog {
            width: min(360px, calc(100% - 32px));
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            text-align: center;
        }

        .badge-dialog::backdrop { background: rgb(0 0 0 / 70%); }
        .badge-dialog-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid var(--line);
            border-radius: 50%;
            background: var(--panel-soft);
        }

        .badge-dialog-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(3.2);
        }
        .badge-dialog h2 { margin: 12px 0 8px; font-size: 20px; }
        .badge-dialog-description { margin: 0 0 18px; color: var(--muted); }
        .badge-dialog-state { margin: 0 0 14px; color: var(--accent); font-size: 13px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .stat {
            position: relative;
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) 48px;
            align-items: center;
            min-width: 0;
            min-height: 100px;
            padding: 12px;
            border-radius: 8px;
            background: #414141;
        }

        .stat-icon {
            grid-column: 1;
            grid-row: 1 / span 2;
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .stat-label {
            grid-column: 2;
            margin: 0 0 4px;
            color: var(--text);
            font-size: 14px;
            text-align: center;
        }

        .stat-value {
            grid-column: 2;
            margin: 0;
            overflow-wrap: anywhere;
            color: white;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
        }

        .stat-spacer { grid-column: 3; grid-row: 1 / span 2; }

        .message {
            margin-top: 18px;
            color: var(--muted);
        }

        .message[data-state="error"] { color: #ffaaa9; }

        @media (max-width: 640px) {
            header { padding: 16px 20px; }
            .header-actions { gap: 10px; }
            main { margin-top: 36px; }
            .stats-grid { grid-template-columns: 1fr; }
            .profile-heading { gap: 10px; }
            .profile-avatar { width: 70px; height: 70px; flex-basis: 70px; }
            .badge-grid { grid-template-columns: repeat(5, 44px); gap: 4px; }
            .badge-button { width: 44px; height: 44px; }
        }

        @media (max-width: 380px) {
            .profile-heading { gap: 8px; }
            .profile-avatar { width: 58px; height: 58px; flex-basis: 58px; }
            .badge-grid { grid-template-columns: repeat(4, 36px); gap: 4px; }
            .badge-button { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html">Blocket</a>
        <nav class="header-actions" aria-label="Main navigation">
            <a class="home-link" href="index.html">Home</a>
            <button id="sign-out" type="button">Sign out</button>
        </nav>
    </header>

    <main>
        <p class="eyebrow">Your account</p>
        <h1>Stats</h1>
        <p class="intro">Your Blocket account overview.</p>

        <section class="profile-heading" aria-label="Player profile">
            <img class="profile-avatar" id="profile-avatar" src="assets/badges/Gold%20Doubloon.webp" alt="Gold Doubloon profile picture">
            <div class="profile-info">
                <p class="eyebrow">Player profile</p>
                <p class="profile-username" id="profile-username">Loading...</p>
                <div class="badge-grid" id="badge-grid" aria-label="Badge collection"></div>
            </div>
        </section>

        <section class="stats-grid" aria-label="Account statistics">
            <article class="stat">
                <img class="stat-icon" src="assets/badges/tokenIcon.webp" alt="">
                <div class="stat-label">Tokens</div>
                <p class="stat-value" id="tokens">Loading...</p>
                <span class="stat-spacer" aria-hidden="true"></span>
            </article>
            <article class="stat">
                <img class="stat-icon" src="assets/badges/unlockIcon.webp" alt="">
                <div class="stat-label">Blooks Unlocked</div>
                <p class="stat-value" id="blooks-unlocked">Loading...</p>
                <span class="stat-spacer" aria-hidden="true"></span>
            </article>
            <article class="stat">
                <img class="stat-icon" src="assets/badges/openedIcon.webp" alt="">
                <div class="stat-label">Packs Opened</div>
                <p class="stat-value" id="packs-opened">Loading...</p>
                <span class="stat-spacer" aria-hidden="true"></span>
            </article>
        </section>
        <p class="message" id="stats-message" role="status" aria-live="polite"></p>
    </main>

    <dialog class="badge-dialog" id="badge-dialog" aria-labelledby="badge-dialog-title">
        <div class="badge-dialog-icon">
            <img class="badge-dialog-image" id="badge-dialog-image" alt="">
        </div>
        <p class="badge-dialog-state" id="badge-dialog-state"></p>
        <h2 id="badge-dialog-title"></h2>
        <p class="badge-dialog-description" id="badge-dialog-description"></p>
        <button id="badge-dialog-close" type="button">Close</button>
    </dialog>

    <script type="module">
        import { getCurrentUser, getStatsPageData, signOut } from './auth.js';

        const message = document.getElementById('stats-message');
        const { user, error } = await getCurrentUser();

        if (error || !user) {
            window.location.replace('login.html');
        } else {
            const account = await getStatsPageData(user.id);

            if (account.error) {
                message.textContent = account.error.message || 'Could not load your profile and badges.';
                message.dataset.state = 'error';
            } else {
                document.getElementById('profile-username').textContent = account.profile.username;
                document.getElementById('profile-avatar').src = account.profile.avatar_path;
                document.getElementById('tokens').textContent = account.stats.tokens.toLocaleString();
                document.getElementById('blooks-unlocked').textContent = `${account.stats.blooks_unlocked.toLocaleString()} / ${account.stats.total_blooks.toLocaleString()}`;
                document.getElementById('packs-opened').textContent = account.stats.packs_opened.toLocaleString();

                const badgeDialog = document.getElementById('badge-dialog');
                document.getElementById('badge-dialog-close').addEventListener('click', () => badgeDialog.close());

                for (const badge of account.badges) {
                    const isEarned = account.earnedBadgeIds.has(badge.id);
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = `badge-button${isEarned ? '' : ' is-locked'}`;
                    item.setAttribute('aria-label', `${isEarned ? 'Earned' : 'Locked'} badge: ${badge.name}`);

                    const image = document.createElement('img');
                    image.className = 'badge-image';
                    image.src = badge.image_path;
                    image.alt = '';
                    image.loading = 'lazy';

                    item.append(image);
                    item.addEventListener('click', () => {
                        document.getElementById('badge-dialog-image').src = badge.image_path;
                        document.getElementById('badge-dialog-state').textContent = isEarned ? 'Earned' : 'Not earned yet';
                        document.getElementById('badge-dialog-title').textContent = badge.name;
                        document.getElementById('badge-dialog-description').textContent = badge.description;
                        badgeDialog.showModal();
                    });
                    document.getElementById('badge-grid').append(item);
                }
            }
        }

        document.getElementById('sign-out').addEventListener('click', async (event) => {
            const button = event.currentTarget;
            button.disabled = true;
            message.textContent = '';
            const { error: signOutError } = await signOut();

            if (signOutError) {
                message.textContent = signOutError.message || 'Could not sign out.';
                message.dataset.state = 'error';
                button.disabled = false;
                return;
            }

            window.location.replace('index.html');
        });
    </script>
</body>
</html>
